<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chúc mừng ngày Phụ nữ Việt Nam 20/10!</title>
<style>
  :root { --gold:#ffe9a8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color:#fff;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(120,70,190,.35), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(40,110,200,.30), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(255,90,160,.18), transparent 50%),
      linear-gradient(#050816, #0b1030 60%, #120a2a);
  }

  /* ---------- Loading ---------- */
  #loader {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:#050816;
    transition:opacity .9s ease, visibility .9s;
  }
  #loader.hide { opacity:0; visibility:hidden; }
  .ring {
    width:84px; height:84px; border-radius:50%;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:#ff8fc2; border-right-color:#ffd27a;
    animation:spin 1.1s linear infinite;
    display:flex; align-items:center; justify-content:center;
  }
  .ring span { font-size:30px; animation:spin 1.1s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .bar { width:min(260px,70vw); height:6px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ff8fc2,#ffd27a); border-radius:6px; }
  #loadText { font-size:15px; letter-spacing:.5px; color:#cdd3ff; }

  /* ---------- Sky ---------- */
  #sky { position:fixed; inset:0; z-index:0; }

  /* ---------- Stage ---------- */
  #stage {
    position:fixed; inset:0; z-index:2; overflow:hidden;
    opacity:0; transition:opacity 1.2s ease;
  }
  #stage.on { opacity:1; }
  h1 {
    font-size:clamp(22px, 4.6vw, 42px); text-align:center; font-weight:700; letter-spacing:.5px;
    background:linear-gradient(90deg,#ffd1e6,#fff3c4,#d9c2ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,160,210,.25);
  }
  #hint { margin-top:8px; font-size:clamp(13px,2.4vw,16px); color:#c9cdf3; text-align:center; min-height:22px; }

  #gardenWrap { width:100%; display:flex; justify-content:center; margin-top:6px; }
  #garden { display:flex; gap:24px; width:576px; flex:none; transform-origin:top center; }

  /* ---------- Flower ---------- */
  .flower {
    position:relative; width:96px; height:230px; flex:none; cursor:pointer;
    transform-origin:50% 100%; animation:sway 5s ease-in-out infinite;
    animation-delay:var(--sw);
  }
  @keyframes sway { 0%,100% { transform:rotate(-1.8deg); } 50% { transform:rotate(1.8deg); } }

  .stem {
    position:absolute; left:50%; top:62px; bottom:0; width:5px; margin-left:-2.5px; border-radius:4px;
    background:linear-gradient(#5fd68f,#1d8a58);
    transform:scaleY(0); transform-origin:50% 100%;
    transition:transform 1.6s cubic-bezier(.2,.9,.3,1) var(--d);
  }
  .stem::before, .stem::after { content:""; position:absolute; width:30px; height:14px; background:#2fb36f; }
  .stem::before { left:4px; top:92px; border-radius:0 100% 0 100%; transform:rotate(-22deg); transform-origin:0 100%; }
  .stem::after { right:4px; top:124px; border-radius:100% 0 100% 0; transform:rotate(22deg); transform-origin:100% 100%; background:#27a465; }
  .flower.show .stem { transform:scaleY(1); }

  .head {
    position:absolute; left:48px; top:62px; width:0; height:0;
    transform:translateY(168px) scale(0); opacity:0;
    transition:transform 1.6s cubic-bezier(.2,.9,.3,1.05) var(--d), opacity .8s ease var(--d);
    filter:drop-shadow(0 0 6px var(--c1));
  }
  .flower.show .head { transform:none; opacity:1; }
  .flower.show:not(.open) .head { animation:glow 2.2s ease-in-out infinite alternate; animation-delay:calc(var(--d) + 1.6s); }
  @keyframes glow { from { filter:drop-shadow(0 0 3px var(--c1)); } to { filter:drop-shadow(0 0 14px var(--c1)); } }
  .flower.show:not(.open):hover .head { transform:scale(1.12); transition-delay:0s; }
  .flower.open .head { transform:scale(1.14); transition-delay:0s; filter:drop-shadow(0 0 16px var(--c1)); }

  .petal {
    position:absolute; left:-14px; bottom:0; width:28px; height:54px;
    transform-origin:50% 100%;
    border-radius:50% 50% 45% 45% / 78% 78% 22% 22%;
    background:linear-gradient(to top, var(--c2), var(--c1));
    box-shadow:inset 0 0 8px rgba(255,255,255,.35);
    transition:transform 1.4s cubic-bezier(.2,.85,.25,1.15);
    transition-delay:calc(var(--i) * 40ms);
  }
  .petal.back { transform:rotate(calc((var(--i) - 3.5) * 4.5deg)) scale(.55,.82); }
  .flower.open .petal.back { transform:rotate(calc(var(--i) * 45deg)) scale(1); }
  .petal.front {
    height:40px; width:24px; left:-12px;
    background:linear-gradient(to top, var(--c1), #fff);
    opacity:.92;
    transform:rotate(calc((var(--i) - 3.5) * 4deg)) scale(.5,.7);
  }
  .flower.open .petal.front { transform:rotate(calc(var(--i) * 45deg + 22.5deg)) scale(1); }

  .core {
    position:absolute; left:-10px; top:-10px; width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6b0, #ffb300);
    box-shadow:0 0 10px #ffd34d;
    transform:scale(0); transition:transform .8s cubic-bezier(.3,1.5,.5,1) .5s;
  }
  .flower.open .core { transform:scale(1); }

  .sepal {
    position:absolute; left:-17px; top:-6px; width:34px; height:24px;
    background:linear-gradient(#3fc27d,#1e8f5b); border-radius:4px 4px 50% 50% / 4px 4px 100% 100%;
    transition:transform .8s ease, opacity .8s ease;
  }
  .flower.open .sepal { transform:translateY(12px) scale(.6); opacity:0; }

  /* ---------- Message panel ---------- */
  #panel {
    margin-top:10px; width:min(520px, 92vw); min-height:132px; padding:18px 22px; text-align:center;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    border-radius:18px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 10px 40px rgba(0,0,0,.35);
    display:flex; flex-direction:column; justify-content:center; gap:8px;
  }
  #panel h2 { font-size:17px; letter-spacing:.4px; }
  #panel p { font-size:clamp(15px,2.6vw,18px); line-height:1.6; color:#f2f3ff; }
  #panel.in h2, #panel.in p { animation:rise .8s ease both; }
  #panel.in p { animation-delay:.12s; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  #count { margin-top:10px; font-size:13px; color:#aab0e6; }

  /* ---------- Effects ---------- */
  .spark {
    position:fixed; z-index:20; width:7px; height:7px; border-radius:50%; pointer-events:none;
    background:var(--sc); box-shadow:0 0 8px var(--sc);
    animation:spark .95s ease-out forwards;
  }
  @keyframes spark {
    from { transform:translate(0,0) scale(1); opacity:1; }
    to { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; }
  }
  .fall {
    position:fixed; top:-40px; z-index:15; pointer-events:none; user-select:none;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translate(var(--dx), 110vh) rotate(360deg); opacity:.9; }
  }

  /* ---------- Chuyển cảnh giữa 2 trang ---------- */
  .page {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px;
  }
  #page1 { transition:transform .9s cubic-bezier(.6,0,.4,1), opacity .9s ease, visibility 0s linear .9s; }
  #stage.p2 #page1 { transform:translateX(-100%); opacity:0; visibility:hidden; pointer-events:none; }
  #page2 {
    transform:translateX(100%); opacity:0; visibility:hidden;
    transition:transform .9s cubic-bezier(.2,.7,.2,1) .6s, opacity .9s ease .6s, visibility 0s linear .6s;
  }
  #stage.p2 #page2 { transform:none; opacity:1; visibility:visible; }

  /* Nút Next */
  #nextBtn {
    position:fixed; right:18px; bottom:18px; z-index:30;
    width:46px; height:46px; border-radius:50%; cursor:pointer; color:#fff;
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transform:translateX(16px);
    transition:opacity .8s ease, transform .8s ease, visibility 0s linear .8s, background .2s;
  }
  #nextBtn.visible {
    opacity:1; visibility:visible; transform:none; transition-delay:0s;
    animation:nudge 1.8s ease-in-out infinite 1s;
  }
  #nextBtn:hover { background:rgba(255,160,210,.38); }
  @keyframes nudge { 50% { box-shadow:0 0 0 8px rgba(255,160,210,.12), 0 0 18px rgba(255,160,210,.5); } }
  #stage.p2 #nextBtn { opacity:0; visibility:hidden; pointer-events:none; animation:none; }

  /* ---------- Trang 2: phong bì ---------- */
  #page2 {
    --ew:min(320px, 78vw);
    --eh:calc(var(--ew) * .66);
    --cw:min(440px, 90vw);
    --ch:min(560px, 78vh);
  }
  .floater { animation:floaty 3.6s ease-in-out infinite; }
  .floater.paused { animation-play-state:paused; }
  @keyframes floaty { 0%,100% { transform:translateY(-6px); } 50% { transform:translateY(8px); } }

  #envWrap { position:relative; width:var(--ew); height:var(--eh); cursor:pointer; }
  #envWrap.opened { cursor:default; }

  .env-part {
    position:absolute; inset:0;
    transition:transform 1.4s cubic-bezier(.55,0,.85,.4);
  }
  #envWrap.drop .env-part { transform:translateY(115vh) rotate(6deg); }
  #envWrap.gone .env-part { visibility:hidden; }

  .env-back {
    z-index:1; border-radius:8px;
    background:linear-gradient(#f59bc0,#f7b3cf);
    box-shadow:0 16px 34px rgba(0,0,0,.4), 0 0 40px rgba(255,150,200,.22);
  }
  .env-front { z-index:3; filter:drop-shadow(0 -2px 4px rgba(120,30,70,.18)); }
  .env-front i { position:absolute; inset:0; display:block; }
  .f-left   { background:linear-gradient(120deg,#ffc2da,#ffd6e6); clip-path:polygon(0 0, 50% 56%, 0 100%); }
  .f-right  { background:linear-gradient(240deg,#ffc2da,#ffd6e6); clip-path:polygon(100% 0, 50% 56%, 100% 100%); }
  .f-bottom { background:linear-gradient(#fff,#ffeef5); clip-path:polygon(0 100%, 50% 56%, 100% 100%); }

  .flap-wrap { z-index:4; perspective:900px; pointer-events:none; }
  #envWrap.flap-behind .flap-wrap { z-index:1; }
  .flap {
    position:absolute; left:0; top:0; width:100%; height:56%;
    transform-origin:50% 0; transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.4,0,.2,1);
  }
  #envWrap.flap-open .flap { transform:rotateX(180deg); }
  .flap .face {
    position:absolute; inset:0;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
  }
  .flap .out { background:linear-gradient(#ff8fbd,#ffb3d1); }
  .flap .in  { background:linear-gradient(#fff,#ffe3ef); transform:rotateX(180deg); }

  .seal {
    position:absolute; left:50%; top:56%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #ff8cb8, #e23a80);
    color:#fff; font-size:18px; box-shadow:0 3px 8px rgba(120,0,50,.45);
    transition:opacity .3s ease; z-index:5;
  }
  #envWrap.flap-open .seal { opacity:0; }

  .tap-hint {
    position:absolute; top:calc(100% + 28px); left:50%; transform:translateX(-50%);
    white-space:nowrap; font-size:15px; color:#ffd1e6; letter-spacing:.3px;
    animation:blink 2s ease-in-out infinite; transition:opacity .4s ease;
  }
  @keyframes blink { 50% { opacity:.45; } }
  #envWrap.flap-open .tap-hint { opacity:0; animation:none; }

  /* ---------- Lá thiệp ---------- */
  .card {
    position:absolute; left:50%; top:50%; z-index:2;
    width:calc(var(--ew) * .84); height:calc(var(--eh) * .78);
    transform:translate(-50%,-50%);
    background:linear-gradient(#fffefe,#fff3f8);
    border:1.5px solid #ffc6de; border-radius:12px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45), 0 0 50px rgba(255,160,210,.25);
    transition:transform .9s cubic-bezier(.3,.7,.2,1),
               width 1.5s cubic-bezier(.2,.8,.2,1), height 1.5s cubic-bezier(.2,.8,.2,1);
  }
  .card::before {
    content:""; position:absolute; inset:9px; border:1px dashed #ffb9d6; border-radius:8px; pointer-events:none;
  }
  #envWrap.rise .card { transform:translate(-50%, calc(-50% - var(--eh) * .42)); }
  #envWrap.drop .card { width:var(--cw); height:var(--ch); transform:translate(-50%,-50%); transition-duration:1.3s, 1.5s, 1.5s; }
  #envWrap.card-front .card { z-index:6; }

  .card-body {
    position:absolute; inset:0; padding:30px 26px 26px; overflow-y:auto;
    opacity:0; transition:opacity .9s ease 1s;
    font-family:"Lora", "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:#6b3b52;
  }
  #envWrap.drop .card-body { opacity:1; }
  .letter { transition:opacity .25s ease; }
  .letter.swap { opacity:0; }
  .letter h3 {
    font-family:"Playfair Display", "Lora", "Segoe UI", Roboto, Arial, sans-serif;
    font-size:clamp(20px,4.4vw,26px); font-style:italic; font-weight:600; color:#e0457f;
    text-align:center; margin:4px 40px 16px; line-height:1.3;
  }
  .letter p { font-size:clamp(14px,2.5vw,16.5px); line-height:1.75; margin-bottom:12px; text-align:justify; }
  .letter .sign { text-align:right; font-style:italic; white-space:pre-line; margin-top:18px; color:#c2336f; }

  .lang {
    position:absolute; top:12px; right:12px; z-index:3;
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    border:1px solid #ffb9d6; background:#fff; color:#e0457f;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .9s ease 1.3s, background .2s, transform .2s;
  }
  #envWrap.drop .lang { opacity:1; pointer-events:auto; }
  .lang:hover { background:#ffe3ef; transform:rotate(-12deg) scale(1.08); }

  /* ---------- Trang trí khung thiệp (nhẹ nhàng) ---------- */
  .card { background:linear-gradient(180deg,#ffe9f2 0, #fffefe 80px, #fff3f8 100%); }
  .corner {
    position:absolute; z-index:2; font-size:17px; line-height:1; pointer-events:none;
    opacity:0; transition:opacity .9s ease 1s;
  }
  #envWrap.drop .corner { opacity:.9; }
  .corner.tl { top:3px; left:4px; transform:rotate(-15deg); }
  .corner.tr { top:3px; right:4px; transform:rotate(15deg); }
  .corner.bl { bottom:3px; left:4px; transform:rotate(15deg); }
  .corner.br { bottom:3px; right:4px; transform:rotate(-15deg); }
  .divider {
    display:flex; align-items:center; gap:10px; margin:0 34px 18px;
    color:#e0457f; font-size:14px; line-height:1;
  }
  .divider::before, .divider::after { content:""; flex:1; height:1px; }
  .divider::before { background:linear-gradient(90deg, transparent, #ffb3d1); }
  .divider::after  { background:linear-gradient(270deg, transparent, #ffb3d1); }

  /* ---------- Nút Next ở trang 2 (hiện sau khi mở thiệp) ---------- */
  #stage.p2.ready2 #nextBtn {
    opacity:1; visibility:visible; pointer-events:auto; transform:none; transition-delay:0s;
    animation:nudge 1.8s ease-in-out infinite 1s;
  }

  /* ---------- Trang 3 ---------- */
  #stage.p3 #page2 {
    transform:translateX(-100%); opacity:0; visibility:hidden; pointer-events:none;
    transition:transform .9s cubic-bezier(.6,0,.4,1), opacity .9s ease, visibility 0s linear .9s;
  }
  #page3 {
    gap:48px; text-align:center;
    transform:translateX(100%); opacity:0; visibility:hidden;
    transition:transform .9s cubic-bezier(.2,.7,.2,1) .6s, opacity .9s ease .6s, visibility 0s linear .6s;
  }
  #stage.p3 #page3 { transform:none; opacity:1; visibility:visible; }

  .greet { font-size:clamp(24px, 5.4vw, 46px); line-height:1.4; max-width:880px; }
  .greet .grad {
    background:linear-gradient(90deg,#ffd1e6,#fff3c4,#d9c2ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .greet .rose { margin-left:.12em; }

  .credits-title { font-size:13px; letter-spacing:4px; text-transform:uppercase; color:#aab0e6; margin-bottom:18px; }
  .credit-list { display:flex; flex-wrap:wrap; justify-content:center; gap:20px 38px; max-width:700px; }
  .credit { min-width:140px; }
  .credit .role { display:block; font-size:12px; letter-spacing:.6px; color:#ffb3d1; margin-bottom:5px; }
  .credit .name { display:block; font-size:17px; font-weight:600; color:#fff; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loader">
  <div class="ring"><span>🌸</span></div>
  <div class="bar"><i id="barFill"></i></div>
  <div id="loadText">Đang chuẩn bị món quà... 0%</div>
</div>

<!-- Bầu trời sao -->
<canvas id="sky"></canvas>

<!-- Nội dung chính -->
<div id="stage">
 <!-- ============ TRANG 1 ============ -->
 <section class="page" id="page1">
  <h1>Chúc mừng ngày Phụ nữ Việt Nam 20/10</h1>
  <div id="hint">Chạm vào từng nụ hoa để nhận lời chúc nhé 🌱</div>
  <div id="gardenWrap"><div id="garden"></div></div>
  <div id="panel">
    <p style="color:#c9cdf3">Những nụ hoa đang chờ bạn đánh thức...</p>
  </div>
  <div id="count">Đã nở 0/5 bông hoa</div>
 </section>

 <!-- ============ TRANG 2 ============ -->
 <section class="page" id="page2">
  <div class="floater" id="floater">
   <div id="envWrap">
     <div class="env-part env-back"></div>

     <!-- Lá thiệp -->
     <div class="card" id="card">
       <button class="lang" id="langBtn" type="button" title="Dịch / Translate" aria-label="Dịch / Translate">
         <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
           <path d="M4 5h9M8.5 3v2M6 5c.4 3 2.6 6 6 8M12 5c-.5 3.2-3 6.5-7 8.5"/>
           <path d="M13 21l4-9 4 9M14.4 18h5.2"/>
         </svg>
       </button>
       <span class="corner tl">🌸</span><span class="corner tr">🌸</span>
       <span class="corner bl">🌸</span><span class="corner br">🌸</span>
       <div class="card-body">
         <div class="letter" id="letter">
           <h3 id="cTitle"></h3>
           <div class="divider"><span>❀</span></div>
           <div id="cText"></div>
           <p class="sign" id="cSign"></p>
         </div>
       </div>
     </div>

     <!-- Mặt trước phong bì -->
     <div class="env-part env-front">
       <i class="f-left"></i><i class="f-right"></i><i class="f-bottom"></i>
     </div>

     <!-- Nắp phong bì -->
     <div class="env-part flap-wrap">
       <div class="flap">
         <div class="face out"></div>
         <div class="face in"></div>
       </div>
       <div class="seal">♥</div>
     </div>

     <div class="tap-hint" id="tapHint">Chạm vào phong bì để mở thư 💌</div>
   </div>
  </div>
 </section>

 <!-- ============ TRANG 3 ============ -->
 <section class="page" id="page3">
  <h1 class="greet"><span class="grad">Chúc các bạn nữ của lớp DHAV22D một ngày 20/10 đáng nhớ</span><span class="rose">🌹</span></h1>
  <div class="credits">
    <div class="credits-title">Credits</div>
    <div class="credit-list" id="creditList"></div>
  </div>
 </section>

 <button id="nextBtn" type="button" aria-label="Trang tiếp theo" title="Tiếp theo">
   <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
 </button>
</div>

<script>
/* ======================================================
   ✏️ SỬA LỜI CHÚC Ở ĐÂY (mỗi bông hoa một câu chúc)
   ====================================================== */
const wishes = [
  { title:"Rạng rỡ",    c1:"#ffb3d1", c2:"#ff4f9a",
    text:"Chúc bạn luôn rạng rỡ như đóa hoa đầu mùa, luôn xinh đẹp, tự tin và tỏa sáng theo cách riêng của mình." },
  { title:"Bình an",    c1:"#ffd98a", c2:"#ff9a1f",
    text:"Chúc bạn sức khỏe dồi dào, tâm hồn bình yên và luôn được yêu thương trong từng khoảnh khắc của cuộc sống." },
  { title:"Thành công", c1:"#dcbcff", c2:"#8f4fff",

const loader = document.getElementById('loader');

let prog = 0;
const loadTimer = setInterval(() => {
  prog = Math.min(100, prog + 2 + Math.random() * 6);
  barFill.style.width = prog + '%';

function startScene() {

/* ---------------- Bầu trời: sao + sao băng ---------------- */
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
let W, H, stars = [], meteors = [], nextMeteor = 0;

function resizeSky() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  const n = Math.round(W * H / 4500);
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.4 + 0.25,
    a: Math.random() * Math.PI * 2,
    s: 0.5 + Math.random() * 1.6
  }));
}

function spawnMeteor() {
  const big = Math.random() < 0.18;
  const vx = -(big ? 7 : 9 + Math.random() * 6);
  const vy = -vx * (0.45 + Math.random() * 0.2);
  meteors.push({
    x: W * (0.25 + Math.random() * 0.85), y: -20 + Math.random() * H * 0.35,
    vx, vy, len: big ? 280 : 110 + Math.random() * 90, w: big ? 3 : 1.6,
    color: big ? (Math.random() < 0.5 ? '255,170,220' : '150,220,255') : '255,255,255'
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 16.67, 3); last = now;
  ctx.clearRect(0, 0, W, H);

  for (const s of stars) {
    s.a += 0.02 * s.s * dt;
    const alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.a));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (now > nextMeteor) { spawnMeteor(); nextMeteor = now + 900 + Math.random() * 2200; }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx * dt; m.y += m.vy * dt;
    const mag = Math.hypot(m.vx, m.vy);
    const tx = m.x - (m.vx / mag) * m.len, ty = m.y - (m.vy / mag) * m.len;
    const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
    g.addColorStop(0, `rgba(${m.color},1)`);
    g.addColorStop(1, `rgba(${m.color},0)`);
    ctx.strokeStyle = g; ctx.lineWidth = m.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.shadowColor = `rgba(${m.color},1)`; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.w * 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    if (m.x < -m.len - 50 || m.y > H + m.len + 50) meteors.splice(i, 1);
  }
  requestAnimationFrame(frame);
}
resizeSky();
requestAnimationFrame(frame);

/* ---------------- Vườn hoa ---------------- */
const garden = document.getElementById('garden');
const panel = document.getElementById('panel');
const countEl = document.getElementById('count');
const hint = document.getElementById('hint');
let opened = 0;

wishes.forEach((w, idx) => {
  const f = document.createElement('div');
  f.className = 'flower';
  f.style.setProperty('--c1', w.c1);
  f.style.setProperty('--c2', w.c2);
  f.style.setProperty('--d', (idx * 0.22) + 's');
  f.style.setProperty('--sw', (-idx * 0.9) + 's');

  let petals = '';
  for (let i = 0; i < 8; i++) petals += `<div class="petal back" style="--i:${i}"></div>`;
  for (let i = 0; i < 8; i++) petals += `<div class="petal front" style="--i:${i}"></div>`;

  f.innerHTML = `
    <div class="stem"></div>
    <div class="head">${petals}<div class="core"></div><div class="sepal"></div></div>`;
  f.addEventListener('click', () => bloom(f, w));
  garden.appendChild(f);
});

function showWish(w) {
  panel.classList.remove('in');
  panel.innerHTML = `<h2 style="color:${w.c1}">🌸 ${w.title}</h2><p>${w.text}</p>`;
  void panel.offsetWidth;
  panel.classList.add('in');
}

function bloom(f, w) {
  if (!f.classList.contains('show')) return;
  if (!f.classList.contains('open')) {
    f.classList.add('open');
    opened++;
    countEl.textContent = `Đã nở ${opened}/5 bông hoa`;
    const r = f.querySelector('.head').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, w.c1);
    if (opened === wishes.length) setTimeout(finale, 1800);
  }
  showWish(w);
}

function burst(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    const ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
    const dist = 50 + Math.random() * 60;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    s.style.setProperty('--sc', i % 3 === 0 ? '#fff6b0' : color);
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function finale() {
  hint.textContent = '💐 Chúc mừng ngày Phụ nữ Việt Nam 20/10! 💐';
  document.getElementById('nextBtn').classList.add('visible');
  const icons = ['🌸', '🌷', '🌺', '💖', '✨'];
  for (let i = 0; i < 36; i++) {
    const e = document.createElement('span');
    e.className = 'fall';
    e.textContent = icons[i % icons.length];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = 14 + Math.random() * 18 + 'px';
    e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    e.style.animationDuration = 5 + Math.random() * 5 + 's';
    e.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 14000);
  }
}

/* Co giãn vườn hoa cho vừa màn hình điện thoại */
function fitGarden() {
  const wrap = document.getElementById('gardenWrap');
  const sw = Math.min(1, (innerWidth - 24) / 576);
  const sh = Math.min(1, (innerHeight - 330) / 230);
  const sc = Math.max(0.45, Math.min(sw, sh));
  garden.style.transform = `scale(${sc})`;
  garden.style.marginLeft = garden.style.marginRight = '0';
  wrap.style.height = 230 * sc + 'px';
}

addEventListener('resize', () => { resizeSky(); fitGarden(); });
fitGarden();

const stageEl = document.getElementById('stage');
document.getElementById('nextBtn').addEventListener('click', () => {
  if (!stageEl.classList.contains('p2')) {            // trang 1 → trang 2
    document.querySelectorAll('.fall').forEach(e => e.remove());
    stageEl.classList.add('p2');
  } else if (!stageEl.classList.contains('p3')) {     // trang 2 → trang 3
    stageEl.classList.remove('ready2');
    stageEl.classList.add('p3');
  }
});

/* ---------------- Phong bì & thiệp ---------------- */
const envWrap = document.getElementById('envWrap');
const floater = document.getElementById('floater');
let envOpened = false;

envWrap.addEventListener('click', () => {
  if (envOpened) return;
  envOpened = true;
  floater.classList.add('paused');
  envWrap.classList.add('opened', 'flap-open');                  // nắp mở ra
  setTimeout(() => envWrap.classList.add('flap-behind'), 350);   // nắp ra sau lá thiệp
  setTimeout(() => envWrap.classList.add('rise'), 500);          // thiệp nhô lên
  setTimeout(() => {                                             // phong bì rơi + thiệp ra giữa
    envWrap.classList.add('drop', 'card-front');
  }, 1000);
  setTimeout(() => {
    const r = document.getElementById('card').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.3, '#ffb3d1');
  }, 1900);
  setTimeout(() => envWrap.classList.add('gone'), 2700);
  setTimeout(() => stageEl.classList.add('ready2'), 2000);   // hiện nút Next sang trang 3
});

/* ---------------- Nội dung thiệp + đổi ngôn ngữ ---------------- */
let lang = 'vi';
const letterEl = document.getElementById('letter');

function renderLetter() {
  const L = letter[lang];
  document.getElementById('cTitle').textContent = L.title;
  const box = document.getElementById('cText');
  box.innerHTML = '';
  L.paragraphs.forEach(t => {
    const p = document.createElement('p');
    p.textContent = t;
    box.appendChild(p);
  });
  document.getElementById('cSign').textContent = L.sign;
  document.documentElement.lang = lang;
}
renderLetter();

document.getElementById('langBtn').addEventListener('click', e => {
  e.stopPropagation();
  letterEl.classList.add('swap');
  setTimeout(() => {
    lang = lang === 'vi' ? 'en' : 'vi';
    renderLetter();
    document.querySelector('.card-body').scrollTop = 0;
    letterEl.classList.remove('swap');
  }, 260);
});
